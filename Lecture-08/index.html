<!-- 1. Inline Elements
An inline element does NOT start a new line. It takes only the space required by its content.

2. Block Elements
A block element starts on a new line and normally takes the full available width. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Elements - HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Yes bro I am a Block Elements</p>    
    <a href="http://ww.google.com">Google</a>
    <div>I am also Block Elements</div>
    <span>I am an span and I am a inline elments</span>
    <a href="">yes he is a inline</a>
    
</body>
</html>
