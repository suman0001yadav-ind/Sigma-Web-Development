<!-- **Attributes for `<video>` Tag**

* **src**: Specifies the path to the video file.


==> **controls**: Adds video controls, like play, pause, and volume.


==> **autoplay**: Automatically starts playing the video when the page loads.


==> **loop**: Repeats the video once it ends.


==> **muted**: Mutes the video by default.


==> **poster**: Specifies an image to be displayed before the video starts playing.


==> **width and height**: Specifies the dimensions of the video.

**The `<audio>` Tag** -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <video src="meme.mp4" height="300" loop controls poster="image.png"></video>

    <audio src="audio.mp3"  controls loop></audio>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/tVzUXW6siu0?si=NuQZuYqrMHn7Pg-i&amp;start=739" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen  height="300"></iframe>


</body>
</html>
