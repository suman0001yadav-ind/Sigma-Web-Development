
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video Gallery</title>
</head>
<body>

    <h1>My Media Gallery</h1>

    <h2>Audio Files</h2>

    <h3>Audio 1</h3>
    <audio src="audio2.mp3" controls loop muted></audio>

    <h3>Audio 2</h3>
    <audio src="2.mp3" controls></audio>

    <h3>Audio 3</h3>
    <audio src="3.mp3" controls></audio>

    <h3>Audio 4</h3>
    <audio src="4.mp3" controls></audio>

    <h3>Audio 5</h3>
    <audio src="5.mp3" controls></audio>

    <h3>Audio 6</h3>
    <audio src="6.mp3" controls></audio>

    <hr>

    <h2>Video Files</h2>

    <h3>Video 1</h3>
    <video src="1.mp4" controls width="400"></video>

    <h3>Video 2</h3>
    <video src="2.mp4" controls width="400"></video>

    <h3>Video 3</h3>
    <video src="3.mp4" controls width="400"></video>

    <h3>Video 4</h3>
    <video src="4.mp4" controls width="400"></video>

    <h3>Video 5</h3>
    <video src="5.mp4" controls width="400"></video>

    <h3>Video 6</h3>
    <video src="6.mp4" controls width="400"></video>

</body>
</html>
